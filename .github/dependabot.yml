version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # boto3, botocore and awswrangler must move together, so they get one PR
      aws:
        patterns: ["boto3", "botocore", "awswrangler", "moto*"]
      python-minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["boto3", "botocore", "awswrangler", "moto*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
