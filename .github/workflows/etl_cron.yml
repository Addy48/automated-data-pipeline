name: Nightly ETL Pipeline

on:
  schedule:
    # Run twice a day at 12:30 UTC (post-IST close) and 21:30 UTC (post-EST close)
    - cron: '30 12,21 * * *'  # Runs at 12:30 UTC (18:00 IST) daily
  workflow_dispatch:      # Allows manual trigger
    inputs:
      exchange:
        description: "Exchange to load"
        type: choice
        options: [ALL, SP500, NIFTY50]
        default: ALL

permissions:
  contents: read

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run ETL Pipeline
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        ATHENA_DATABASE: ${{ secrets.ATHENA_DATABASE }}
        ATHENA_WORKGROUP: ${{ secrets.ATHENA_WORKGROUP }}
        ATHENA_OUTPUT_LOCATION: ${{ secrets.ATHENA_OUTPUT_LOCATION }}
        EXCHANGE: ${{ inputs.exchange || 'ALL' }}
        ETL_S3: ${{ vars.ETL_S3 }}
      run: |
        # Set the repository variable ETL_S3=true once the S3 lake exists. Then every stage
        # and upload must succeed (--require-s3). Without it the run is local-only (--dry-run)
        # and the gold file is kept as a workflow artifact instead.
        if [ "$ETL_S3" = "true" ]; then
          python run_pipeline.py --require-s3 --exchange "$EXCHANGE"
        else
          python run_pipeline.py --dry-run --exchange "$EXCHANGE"
        fi

    - name: Upload run metrics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: etl-metrics
        path: logs/metrics_*.json
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload gold file (local-only runs)
      if: ${{ vars.ETL_S3 != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: gold-latest
        path: data/sector_growth_data.parquet
        retention-days: 7
